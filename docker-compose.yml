# One to One — local/self-hosted orchestration for the two independent
# projects in this repo (see CLAUDE.md). No MongoDB service here on purpose:
# this project uses MongoDB Atlas (see backend/.env's MONGO_URI) — Docker is
# only replacing where the Express API + Next.js app run, not the database.
#
# Setup:
#   1. backend/.env must exist (copy from backend/.env.example) — it's
#      loaded via env_file below, never baked into the backend image.
#   2. Copy .env.example (this directory) to .env and set NEXT_PUBLIC_API_URL
#      to a URL your BROWSER can reach (not the "backend" service hostname —
#      see frontend/Dockerfile's comment on why).
#   3. docker compose up --build
#
# Uploaded images (backend/src/uploads) persist in the named volume below
# across container recreates — see CLAUDE.md's "Image storage" section for
# why this needs to be durable.

services:
  backend:
    build:
      context: ./backend
    image: one-to-one-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_uploads:/app/src/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    image: one-to-one-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_uploads:
